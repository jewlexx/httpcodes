name: Publish
on:
  release:
    types: [published]

jobs:
  publish:
    strategy:
      matrix:
        project: ["deno"]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Enter {{ matrix.project }} directory
        run: cd projects/{{ matrix.project }}

      - name: Generate files
        run: deno run generate

      - name: Publish package
        run: deno publish
